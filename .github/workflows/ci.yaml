name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"

# Default for every job: read the repo, nothing else. Jobs ask for more when they need it
permissions:
  contents: read

# One run at a time per branch. PR runs cancel older ones; main runs queue so a deploy is never cut off
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest