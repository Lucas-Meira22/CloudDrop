name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"

# Default for every job: read the repo, nothing else. Jobs ask for more when they need it
permissions:
  contents: read

# One run at a time per branch. PR runs cancel older ones; main runs queue so a deploy is never cut off
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
  image:

    name: Build and scan image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t clouddrop:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: clouddrop:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::137286422208:role/clouddrop-github-ci
          aws-region: us-east-1

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      
      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker tag clouddrop:$TAG $REGISTRY/clouddrop:$TAG
          docker push $REGISTRY/clouddrop:$TAG
  bump-tag:
    name: Bump image tag in prod overlay
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag to this commit
        working-directory: k8s/overlays/prod
        env:
          IMAGE: 137286422208.dkr.ecr.us-east-1.amazonaws.com/clouddrop
          TAG: ${{ github.sha }}
        run: kustomize edit set image $IMAGE:$TAG

      - name: Commit and push the new tag
        env:
          TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag already set, nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump clouddrop image to ${TAG::7}"
          git pull --rebase origin main
          git push origin HEAD:main