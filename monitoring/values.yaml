# Helm values for prometheus-community/kube-prometheus-stack, sized for one k3s node

# Routes alerts to Slack/email. No alert receivers are set up, so leave it out
alertmanager:
  enabled: false

# k3s runs these inside its single k3s process instead of as separate pods,
# so the chart's scrape targets for them would always show as DOWN
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Also pick up ServiceMonitors this Helm release didn't create (like the app's)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Keep 2 days of metrics. Without persistent storage, a pod restart loses them anyway
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  # Read the admin login from a Secret created by hand (kept out of Git).
  # Otherwise the chart makes a random password on every render. Argo CD renders
  # with `helm template`, which can't look up the old one, so each new commit
  # would change the password and restart Grafana
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi