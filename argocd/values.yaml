# Helm values for the argo/argo-cd chart, trimmed to fit one node next to the app

# SSO server. We log in with the built-in admin user, so it isn't needed
dex:
  enabled: false

# Sends Slack/email alerts on sync events. Not used here
notifications:
  enabled: false

# Reconciles Applications: compares Git with the cluster and syncs them.
# Holds every managed resource in memory, so it grows with what Argo CD manages;
# 512Mi was OOMKilled while syncing kube-prometheus-stack and its large CRDs
controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

# Clones the repo and renders the manifests (runs kustomize build)
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# API and web UI
server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Cache for rendered manifests and cluster state
redis:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi
