apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clouddrop
  namespace: argocd
  # Deleting this Application also deletes the app's resources in the cluster
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucas-Meira22/CloudDrop.git
    targetRevision: main
    path: k8s/overlays/prod
  # Where they get deployed
  destination:
    server: https://kubernetes.default.svc
    namespace: clouddrop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


