apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddrop
  labels:
    app: clouddrop
spec:
  selector:
    matchLabels:
      app: clouddrop
  template:
    metadata:
      labels:
        app: clouddrop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: clouddrop
          image: 137286422208.dkr.ecr.us-east-1.amazonaws.com/clouddrop
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: clouddrop-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi