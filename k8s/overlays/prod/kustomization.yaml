apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The bucket is per environment, so prod adds it on top of the base config
configMapGenerator:
  - name: clouddrop-config
    behavior: merge
    literals:
      - BUCKET_NAME=clouddrop-files-137286422208-us-east-1

images:
  - name: 137286422208.dkr.ecr.us-east-1.amazonaws.com/clouddrop
    newTag: e8c2590