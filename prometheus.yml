# Local-only Prometheus config for docker compose. On the cluster (Block 6) scraping
# is done by kube-prometheus-stack via a ServiceMonitor instead of this file.
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: 'clouddrop'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clouddrop:8000'] # compose service name : container port
